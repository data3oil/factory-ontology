name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt -r ../requirements-dev.txt
      - name: 预建本体(api_server 在 import 阶段即读取 output/food.nt)
        # 必须走 food_demo._build_kb(): 它有 food 语义的显式 rels
        # (belongsToBatch/usesRawMaterial/produces)。直接调 multi_table 只会
        # "自动检测"出 1 个跨表属性, 建出的本体没有 batch<->raw 边, 溯源接口返回空。
        # food 未配 schema, 不会自动重建; 干净检出也没有 output/*.nt(生成物不提交)。
        run: |
          mkdir -p output
          python -c "import food_demo; food_demo._build_kb()"
          ls -l output/food.nt
      - name: 预建阀门本体(公理闭环用例 test_routes_and_ask_loop 依赖 output/valve.nt)
        # 2026-11-10: 这一步此前缺失, 导致该用例在干净检出上一条断言就跑挂
        # (axiom_service.run() 拿不到 nt → 返回 ok:false → 断言 200 && ok 失败),
        # 而本机因为 output/valve.nt 已存在一直通过——典型的"本地绿、CI 红"。
        # 必须走 valve_demo.build(): 它有阀门语义的显式 rels(produces/usesRawMaterial),
        # 自动建模只认出 1 处跨表关系, 建出的 nt 没有 产品<-批次->原料 的边,
        # 于是 /api/ask 的 "P004 用了哪些原料" 落回 rule 引擎, 公理闭环断言照样失败。
        # 也不要换 multi_model.build(): 除了同样缺显式 rels, 它还会把 kbs.json 里的
        # "output/valve.nt" 写成 Windows 反斜杠, 并把 lexicon_valve.json 覆盖成精简版。
        run: |
          python -c "import valve_demo; valve_demo.build()"
          ls -l output/valve.nt
      - name: 工程门（去演示化 / 断链 / 静默吞异常 / 界面文案）
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/check_demo_assets.py
          python scripts/check_route_reachability.py
          python scripts/check_silent_except.py
          python scripts/check_ui_copy.py

      - name: 运行单测(数据加载/本体生成/规则问答/GraphRAG)
        run: |
          python -m pytest tests/ -v --tb=short
      - name: 运行对照评测(规则引擎零模型)
        run: |
          # benchmark 需先建本体; 用 data_loader 直接建(无需 LLM 词典的路径已由单测覆盖)
          # 2026-09 数据目录重组: 各数据集从 data/ 迁到各自的 data_<name>/ 子目录
          python -c "import sys; sys.path.insert(0,'.'); import csv_to_owl as c; import os; \
            pairs=[('data_ai4i','ai4i.csv'),('data_library','library_inventory.csv'),('data_energy_station','energy_station.csv')]; \
            [c.build_nt(os.path.join(d,f), os.path.join('output',f.replace('.csv','.nt'))) for d,f in pairs]"
          python benchmark.py data_library/library_inventory.csv | tail -2
          python benchmark.py data_energy_station/energy_station.csv | tail -2

  ontology-check:
    # 本体检查: 核查全库数据质量/链路断链/一致性(纯标准库零依赖, 独立 CLI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 本体检查(零依赖, 阈值通过)
        # ontology_check.py 仅用标准库, 无需安装任何依赖
        run: |
          python ontology_check.py --threshold 60 --json ontology_check_report.json
      - name: 打印本体检查关键指标
        run: |
          python -c "import json;d=json.load(open('ontology_check_report.json'));print('score=%s ok=%s critical=%s n_issues=%s'%(d['score'],d['ok'],d['critical'],d['n_issues']))"

  self-check:
    # 新增: 边界/断链静态自检 + 既有自检工具(能跑就跑)。
    # 全部从仓库根以相对路径运行, 不写死本机路径/解释器(用 setup-python 的 python)。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 预建本体(部分自检依赖 api_server 的 output/food.nt)
        run: |
          mkdir -p codes/output
          cd codes && python -c "import food_demo; food_demo._build_kb()"
      - name: 边界与断链静态自检(纯标准库; 记录结果, 不阻断)
        # check_boundary 会命中已知的“开源卫生项”(真实企业名/本机路径), 当前为红;
        # check_chainbreak 会命中无前端入口的后端路由。这里只做“记录+可见”,
        # 待相应净化批处理后再考虑改为阻断门(见 docs/实验/检查工具与CI-20260924.md)。
        continue-on-error: true
        run: |
          echo "==== scripts/check_boundary.py ===="
          python scripts/check_boundary.py || true
          echo "==== scripts/check_chainbreak.py ===="
          python scripts/check_chainbreak.py || true
      - name: 合规扫描（本机路径 / 用户名 / 内网IP / 密钥 / 客户与个人信息）
        # 2026-11-10 起设为阻断门。此前它"通过"是不可信的：git ls-files 默认把中文
        # 文件名转义成 "\345\256..."，脚本拿转义串当路径，os.path.isfile 恒假，
        # 所有中文名文档被静默跳过——30 处本机路径一处都没报出来。
        # 只跑工作区模式（历史遗留另用 --history 人工核查，全量约 30s）。
        run: python scripts/pre_push_scan.py
      - name: 既有自检工具(能跑就跑, 单脚本失败不阻断)
        # verify_* 与 eval_qa 依赖本机环境/建好的本体; CI 上未必都能跑通,
        # 故逐个跑并打印退出码, 任一失败不阻断整条流水线(跑得到就跑)。
        continue-on-error: true
        run: |
          for s in scripts/verify_kb_registry.py scripts/verify_hardening.py \
                   scripts/verify_flows.py scripts/verify_qa_envelope.py; do
            echo "==== ${s} ===="
            python "${s}" || echo "[skip/fail] ${s} 返回非零(环境或本机依赖)"
          done
          echo "==== scripts/eval_qa.py (dry) ===="
          python scripts/eval_qa.py --dry || echo "[skip/fail] eval_qa.py --dry 返回非零"
