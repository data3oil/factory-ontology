<rect x="840" y="722" width="350" height="50" rx="8" fill="#ecfeff" stroke="#a5f3fc"/><text x="862" y="742" fill="#0f172a" font-size="16" font-family="Microsoft YaHei">词典 · config/lexicon_&lt;kb&gt;.json</text><text x="862" y="761" fill="#64748b" font-size="13" font-family="Microsoft YaHei">中文字段名/枚举值/同义词，问答靠它</text>

