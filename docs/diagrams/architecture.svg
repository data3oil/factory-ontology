<text x="90" y="288" fill="#0f172a" font-size="16" font-family="Microsoft YaHei">/api/ask · /api/axioms（读/存/重生成/推理）· /api/trace/* · /api/scan · /api/ontology/*（图/演进/契约）</text>
<text x="90" y="312" fill="#64748b" font-size="15" font-family="Microsoft YaHei">角色化鉴权（admin/read，fail-closed）· 多租户行级隔离 · 令牌吊销与限速 · 哈希链审计 · 上传上限</text>

<line x1="640" y1="334" x2="640" y2="360" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ar)"/>

