<rect width="1280" height="1010" fill="url(#bg)"/>
<text x="640" y="46" fill="#0f172a" font-size="36" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei">factory-ontology 系统架构</text>
<text x="640" y="76" fill="#64748b" font-size="17" text-anchor="middle" font-family="Microsoft YaHei">本体驱动 · 规则确定性 · 公理推理可解释 · GraphRAG 兜底 · 数据不出厂 · v0.6.0</text>

