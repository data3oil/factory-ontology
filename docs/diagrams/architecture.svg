<text x="112" y="486" fill="#64748b" font-size="13" font-family="Microsoft YaHei">实体/关系/属性角色 · suggest_schema</text>
<text x="112" y="512" fill="#0f172a" font-size="15" font-family="Microsoft YaHei">公理集 + 前向链推理机</text>
<text x="112" y="534" fill="#64748b" font-size="13" font-family="Microsoft YaHei">链/单值/不相交/业务规则 · 带依据</text>
