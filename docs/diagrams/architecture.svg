<text x="112" y="582" fill="#64748b" font-size="13" font-family="Microsoft YaHei">数量/极值/平均/过滤/范围/计数</text>

<!-- rag 原子 -->
<rect x="465" y="410" width="350" height="180" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/>
<text x="487" y="436" fill="#6d28d9" font-size="18" font-weight="bold" font-family="Microsoft YaHei">rag 原子</text>
<text x="487" y="464" fill="#0f172a" font-size="15" font-family="Microsoft YaHei">本体引导 GraphRAG</text>
<text x="487" y="486" fill="#64748b" font-size="13" font-family="Microsoft YaHei">沿关系路径扩种子 → 子图检索 + LLM</text>
<text x="487" y="512" fill="#0f172a" font-size="15" font-family="Microsoft YaHei">向量混合检索</text>
<text x="487" y="534" fill="#64748b" font-size="13" font-family="Microsoft YaHei">BM25 稀疏 + 本地向量，RRF 融合</text>
<text x="487" y="560" fill="#0f172a" font-size="15" font-family="Microsoft YaHei">逻辑推理桥</text>
<text x="487" y="582" fill="#64748b" font-size="13" font-family="Microsoft YaHei">LLM 转逻辑查询 → 确定性执行</text>

<!-- 事件原子 -->
<rect x="840" y="410" width="350" height="180" rx="10" fill="#fff7ed" stroke="#fdba74"/>
<text x="862" y="436" fill="#c2410c" font-size="18" font-weight="bold" font-family="Microsoft YaHei">事件原子 + 扩展</text>
<text x="862" y="464" fill="#0f172a" font-size="15" font-family="Microsoft YaHei">数据变更领域事件</text>
<text x="862" y="486" fill="#64748b" font-size="13" font-family="Microsoft YaHei">DATA_ADDED / METRIC_ANOMALY / …</text>
<text x="862" y="512" fill="#0f172a" font-size="15" font-family="Microsoft YaHei">生态插件（四类扩展点）</text>
<text x="862" y="534" fill="#64748b" font-size="13" font-family="Microsoft YaHei">decision / data_source / push / template</text>
<text x="862" y="560" fill="#0f172a" font-size="15" font-family="Microsoft YaHei">MCP server</text>
<text x="862" y="582" fill="#64748b" font-size="13" font-family="Microsoft YaHei">AI agent 可直接调问答与溯源</text>

<!-- 问答链路 -->
<rect x="90" y="604" width="1100" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5,4"/>
<text x="110" y="627" fill="#334155" font-size="15" font-family="Microsoft YaHei">问答降级链： 规则引擎 → 公理推理机 → 逻辑推理桥 → 本体引导 GraphRAG → 向量混合检索 → LLM 兜底（确定性优先，逐层兜底）</text>

