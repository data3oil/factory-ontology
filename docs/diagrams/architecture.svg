<rect x="90" y="722" width="350" height="50" rx="8" fill="#ecfeff" stroke="#a5f3fc"/><text x="112" y="742" fill="#0f172a" font-size="16" font-family="Microsoft YaHei">本体图 · output/&lt;kb&gt;.nt</text><text x="112" y="761" fill="#64748b" font-size="13" font-family="Microsoft YaHei">N-Triples 标准序列化，实体-关系-属性</text>
