<rect x="840" y="142" width="350" height="46" rx="8" fill="#f0fdfa" stroke="#99f6e4"/><text x="862" y="162" fill="#0f172a" font-size="17" font-family="Microsoft YaHei">语音助手（本地）</text><text x="862" y="180" fill="#64748b" font-size="13" font-family="Microsoft YaHei">faster-whisper · edge-tts</text>

<line x1="640" y1="200" x2="640" y2="226" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ar)"/>

<!-- API 层 -->
<rect x="60" y="230" width="1160" height="104" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<rect x="60" y="230" width="1160" height="6" rx="3" fill="#7c3aed"/>
