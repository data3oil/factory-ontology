<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1090" viewBox="0 0 1280 1090">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
</defs>
<rect width="1280" height="1090" fill="url(#bg)"/>
<text x="640" y="46" fill="#0f172a" font-size="36" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei">工厂落地路线</text>
<text x="640" y="78" fill="#64748b" font-size="17" text-anchor="middle" font-family="Microsoft YaHei">七步从零到被使用 · 每一步都有工具支撑 · v0.6.0</text>

<!-- 连接竖线 -->
<line x1="136" y1="136" x2="136" y2="904" stroke="#cbd5e1" stroke-width="2"/>

<!-- 1 -->
<rect x="90" y="112" width="1100" height="106" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="90" y="122" width="6" height="86" rx="3" fill="#0d9488"/>
<circle cx="136" cy="165" r="24" fill="#0d9488"/><text x="136" y="173" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei">1</text>
<text x="180" y="144" fill="#0f172a" font-size="20" font-weight="bold" font-family="Microsoft YaHei">建知识库骨架</text>
<text x="180" y="170" fill="#334155" font-size="14" font-family="Microsoft YaHei">一条命令注册 kbs.json、建数据目录、生成词典模板与表结构说明</text>
<text x="180" y="196" fill="#0d9488" font-size="12.5" font-family="Consolas, monospace">codes/new_kb.py</text>
<text x="316" y="196" fill="#94a3b8" font-size="12" font-family="Microsoft YaHei">→ config/kbs.json</text>

<!-- 2 -->
<rect x="90" y="240" width="1100" height="106" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="90" y="250" width="6" height="86" rx="3" fill="#0d9488"/>
<circle cx="136" cy="293" r="24" fill="#0d9488"/><text x="136" y="301" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei">2</text>
<text x="180" y="272" fill="#0f172a" font-size="20" font-weight="bold" font-family="Microsoft YaHei">接入企业数据 · 建模</text>
<text x="180" y="298" fill="#334155" font-size="14" font-family="Microsoft YaHei">多表 CSV → schema 驱动统一建模 → N-Triples；数据变了才重建，reconcile 保幂等</text>
<text x="180" y="324" fill="#0d9488" font-size="12.5" font-family="Consolas, monospace">codes/multi_model.py</text>
<text x="340" y="324" fill="#94a3b8" font-size="12" font-family="Microsoft YaHei">→ output/&lt;kb&gt;.nt</text>

<!-- 3 -->
<rect x="90" y="368" width="1100" height="106" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="90" y="378" width="6" height="86" rx="3" fill="#0d9488"/>
<circle cx="136" cy="421" r="24" fill="#0d9488"/><text x="136" y="429" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei">3</text>
<text x="180" y="400" fill="#0f172a" font-size="20" font-weight="bold" font-family="Microsoft YaHei">配词典（领域适配）</text>
<text x="180" y="426" fill="#334155" font-size="14" font-family="Microsoft YaHei">中文字段名、同义词组、数值字段——换行业换的是这里，规则引擎与检索链路不动</text>
<text x="180" y="452" fill="#0d9488" font-size="12.5" font-family="Consolas, monospace">config/lexicon_&lt;kb&gt;.json</text>

<!-- 4 -->
<rect x="90" y="496" width="1100" height="106" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
<rect x="90" y="506" width="6" height="86" rx="3" fill="#7c3aed"/>
<circle cx="136" cy="549" r="24" fill="#7c3aed"/><text x="136" y="557" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei">4</text>
<text x="180" y="528" fill="#4c1d95" font-size="20" font-weight="bold" font-family="Microsoft YaHei">配公理集 · 跑推理</text>
<text x="180" y="554" fill="#334155" font-size="14" font-family="Microsoft YaHei">种子沿数据里真实存在的边找路径，生成为一份可读 JSON，人来改；前向链推新事实，产物不写回本体</text>
<text x="180" y="580" fill="#7c3aed" font-size="12.5" font-family="Consolas, monospace">codes/axiom_service.py · codes/axiom_reason.py</text>
<text x="590" y="580" fill="#94a3b8" font-size="12" font-family="Microsoft YaHei">→ config/axioms/&lt;kb&gt;.json</text>

<!-- 5 -->
<rect x="90" y="624" width="1100" height="106" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="90" y="634" width="6" height="86" rx="3" fill="#0d9488"/>
<circle cx="136" cy="677" r="24" fill="#0d9488"/><text x="136" y="685" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei">5</text>
<text x="180" y="656" fill="#0f172a" font-size="20" font-weight="bold" font-family="Microsoft YaHei">部署上线</text>
<text x="180" y="682" fill="#334155" font-size="14" font-family="Microsoft YaHei">docker compose 一条命令起全栈；FOOD_MODEL=local 走本机 Ollama，数据不出厂</text>
<text x="180" y="708" fill="#0d9488" font-size="12.5" font-family="Consolas, monospace">docker-compose.yml</text>

<!-- 6 -->
<rect x="90" y="752" width="1100" height="106" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="90" y="762" width="6" height="86" rx="3" fill="#0d9488"/>
<circle cx="136" cy="805" r="24" fill="#0d9488"/><text x="136" y="813" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei">6</text>
<text x="180" y="784" fill="#0f172a" font-size="20" font-weight="bold" font-family="Microsoft YaHei">用起来</text>
<text x="180" y="810" fill="#334155" font-size="14" font-family="Microsoft YaHei">Web 问答带证据溯源 · 公理与推理页可改可跑可试问 · REST 原子接口供闭源编排层调度</text>
<text x="180" y="836" fill="#0d9488" font-size="12.5" font-family="Consolas, monospace">web/ · /api/ask · /api/axioms</text>

<!-- 7 -->
<rect x="90" y="880" width="1100" height="106" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="90" y="890" width="6" height="86" rx="3" fill="#0d9488"/>
<circle cx="136" cy="933" r="24" fill="#0d9488"/><text x="136" y="941" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei">7</text>
<text x="180" y="912" fill="#0f172a" font-size="20" font-weight="bold" font-family="Microsoft YaHei">运维与合规</text>
<text x="180" y="938" fill="#334155" font-size="14" font-family="Microsoft YaHei">十道自检门 + 问答评测基线 + 哈希链审计账本 + 推送前脱敏扫描</text>
<text x="180" y="964" fill="#0d9488" font-size="12.5" font-family="Consolas, monospace">scripts/run_all_gates.py</text>

<!-- 底部横幅 -->
<rect x="90" y="1012" width="1100" height="54" rx="12" fill="#0d9488"/>
<text x="640" y="1046" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle" font-family="Microsoft YaHei">换一个工厂，只换「数据 / schema / 词典 / 公理集」四样，代码不动</text>
</svg>
